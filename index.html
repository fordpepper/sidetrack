<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liner — endless new music from the music you love</title>
<meta name="description" content="Import a playlist, then scroll through an endless feed of new artists picked from the music you already love.">
<meta name="theme-color" content="#0E1020">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230E1020'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23F2B43A'/%3E%3Ccircle cx='16' cy='16' r='1.4' fill='%230E1020'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="feed" class="feed" aria-label="Song feed">
  <section class="slide loader" id="loader"><div class="ltext"><span class="spin" aria-hidden="true"></span><p id="lmsg">Finding the next song</p><button class="btn" id="lretry" hidden>Try again</button></div></section>
</main>

<header class="top">
  <span class="logo"><span class="disc" aria-hidden="true"></span>Liner</span>
  <div class="topr">
    <button class="pill" id="auto" role="switch" aria-checked="false"><span class="knob" aria-hidden="true"></span>Auto</button>
    <button class="pill" id="libbtn" aria-label="Library"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="lbl">Library</span></button>
  </div>
</header>
<p class="keys" aria-hidden="true">↑ ↓ browse &nbsp; L like &nbsp; Space pause &nbsp; A auto</p>

<div class="start" id="start"></div>

<dialog id="sheet" aria-label="Library"><div id="sheetBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
